<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>내 아이폰 웹 앱</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333; /* 아이폰 배경색 느낌 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #phone-screen {
            width: 375px; /* 아이폰 13/14 크기 가상 구현 */
            height: 812px;
            background-image: url('https://w0.peakpx.com/wallpaper/52/65/HD-wallpaper-ios-15-abstract-dynamic-stock-wallpaper-original-apple-iphone.jpg'); /* 가상 배경 이미지 */
            background-size: cover;
            border-radius: 40px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        #notch {
            width: 150px;
            height: 25px;
            background-color: black;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        #status-bar {
            display: flex;
            justify-content: space-between;
            padding: 5px 15px 0 15px;
            font-size: 14px;
        }
        #app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 50px;
        }
        .app-icon {
            text-align: center;
            cursor: pointer;
        }
        .app-icon-img {
            width: 60px;
            height: 60px;
            background-color: white;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }
        .app-icon-label {
            font-size: 12px;
        }
        #messages-icon-img { background-color: #34c759; } /* 메시지 앱 초록색 */
        #phone-icon-img { background-color: #1d72b8; } /* 전화 앱 파란색 */

        /* 가상 앱 화면 */
        #app-screen-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            color: black;
            border-radius: 40px;
            z-index: 20;
            flex-direction: column;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        #app-screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        #close-app {
            background: none;
            border: none;
            color: #007aff;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="phone-screen">
        <div id="notch"></div>
        <div id="status-bar">
            <span>9:41</span>
            <span>SKT 📶</span>
        </div>

        <div id="app-grid">
            <div class="app-icon" id="messages-icon">
                <div class="app-icon-img" id="messages-icon-img">
                    <span style="font-size: 30px;">💬</span>
                </div>
                <div class="app-icon-label">메시지</div>
            </div>
            <div class="app-icon" id="phone-icon">
                <div class="app-icon-img" id="phone-icon-img">
                    <span style="font-size: 30px;">📞</span>
                </div>
                <div class="app-icon-label">전화</div>
            </div>
            <!-- 추가 앱 아이콘들... -->
        </div>

        <!-- 가상 앱 화면 -->
        <div id="app-screen-container">
            <div id="app-screen-header">
                <button id="close-app">홈으로</button>
                <h2 id="app-screen-title">애플리케이션</h2>
                <div style="width: 50px;"></div> <!-- 정렬용 여백 -->
            </div>
            <div id="app-screen-content">
                <p>앱 콘텐츠가 여기에 표시됩니다.</p>
                <!-- 실제 채팅이나 전화 UI를 여기에 구현 -->
            </div>
        </div>
    </div>

    <script>
        const messagesIcon = document.getElementById('messages-icon');
        const phoneIcon = document.getElementById('phone-icon');
        const appScreenContainer = document.getElementById('app-screen-container');
        const appScreenTitle = document.getElementById('app-screen-title');
        const appScreenContent = document.getElementById('app-screen-content');
        const closeAppBtn = document.getElementById('close-app');

        messagesIcon.addEventListener('click', () => {
            appScreenTitle.innerText = '메시지';
            appScreenContent.innerHTML = '<p>최근 채팅 목록...</p><p>user1: 안녕하세요!</p>';
            appScreenContainer.style.display = 'flex';
        });

        phoneIcon.addEventListener('click', () => {
            appScreenTitle.innerText = '전화';
            appScreenContent.innerHTML = '<p>최근 통화 기록...</p><p>엄마 (010-XXXX-XXXX)</p>';
            appScreenContainer.style.display = 'flex';
        });

        closeAppBtn.addEventListener('click', () => {
            appScreenContainer.style.display = 'none';
        });
    </script>
</body>
</html>
